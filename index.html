<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalam AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #26344c;
}

.logo {
  background: linear-gradient(135deg,#2879ed,#36c7df);
  padding: 12px 17px;
  border-radius: 14px;
  font-size: 25px;
  font-weight: bold;
}

h1 {
  font-size: 21px;
}

main {
  max-width: 750px;
  margin: auto;
  padding: 25px;
  text-align: center;
}

h2 {
  margin-top: 100px;
  font-size: 38px;
}

h2 span {
  color: #55baff;
}

p {
  color: #9aaac4;
  line-height: 1.7;
}

.chat {
  margin-top: 45px;
  display: flex;
  gap: 10px;
  background: #111e34;
  padding: 12px;
  border: 1px solid #263d5d;
  border-radius: 18px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 10px;
}

button {
  background: linear-gradient(135deg,#4da3ff,#58d5e8);
  border: none;
  padding: 13px 19px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
}

#messages {
  text-align: left;
  margin-top: 30px;
}

.message {
  background: #111e34;
  padding: 15px;
  border-radius: 15px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.user {
  background: #16345b;
}

footer {
  text-align: center;
  color: #71819b;
  padding: 30px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Q</div>
  <div>
    <strong>Qalam AI</strong>
    <p>Your Kurdish AI Assistant</p>
  </div>
</header>

<main>
  <h2>Welcome to <span>Qalam AI</span></h2>

  <p>
    یاریدەدەری زیرەکی دەستکردی تۆ.
    بە کوردی یان ئینگلیزی پرسیار بکە.
  </p>

  <div id="messages"></div>

  <div class="chat">
    <input
      id="question"
      placeholder="پرسیارەکەت بنووسە..."
    >
    <button onclick="sendMessage()">➤</button>
  </div>
</main>

<footer>
  Qalam AI © 2026
</footer>

<script>
function sendMessage() {
  const input = document.getElementById("question");
  const messages = document.getElementById("messages");

  const question = input.value.trim();

  if (!question) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = question;

  messages.appendChild(user);

  const answer = document.createElement("div");
  answer.className = "message";
  answer.textContent =
    "Welcome! Qalam AI is getting ready. Real AI connection will be added in the next step.";

  messages.appendChild(answer);

  input.value = "";
}
</script>

</body>
</html>
